  - topic: Nomen-Verb-Verbindungen
    subtopics:
      - name: Das Nomen und das zugrunde liegende Verb haben die gleiche Bedeutung
        examples:
          - eine Entscheidung treffen = entscheiden
          - eine Verbesserung vornehmen = verbessern
          - eine Erklaerung abgeben = erklaeren
      - name: Die bedeutung der Nomen-Verb-Verbindung kann mann nicht direkt vom Nome ableiten
        examples:
          - unter Druck stehen != druecken
          - in Frage kommen != fragen
          - zur Verfügung stehen != verfügen
