name: Content checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Runs on pull requests from forks too, so it gets a read-only token and no
# secrets. Nothing here publishes.
permissions:
  contents: read

concurrency:
  group: content-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Article checks and strict site build
        run: uv run ol check
