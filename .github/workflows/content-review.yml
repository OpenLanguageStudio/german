name: Content review

# Sets the content-review status on every pull request: success for a trivial
# change, pending for one that needs a review, which the reviewer clears with
# `ol review-status`. The tiers are described in the package's
# docs/reference/content-review.md.
#
# pull_request_target runs this file from main with a token that may set
# statuses, also for pull requests from forks. It checks out main, never the
# pull request: the tier is read from the GitHub API, so no code from the pull
# request runs here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: content-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tier:
    name: Content review tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Work out the tier and set the status
        run: uv run ol review-tier --pr ${{ github.event.pull_request.number }} --post
        env:
          GH_TOKEN: ${{ github.token }}
